# 8080 is for Payment gateway
server.port=9081

spring.application.name=ledger-service

#postgreSQL conf
spring.datasource.url=jdbc:postgresql://localhost:5432/ledgerdb
spring.datasource.username=postgres
spring.datasource.password=908419

#using hibernate to handle automatic creation of tables based on java entities
spring.jpa.hibernate.ddl-auto=update

#postgre Dialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

#print sql queries
spring.jpa.show-sql=true

spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=ledger-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
